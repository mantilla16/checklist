# Nginx delante de la aplicacion.
#   sudo cp despliegue/nginx-checklist.conf /etc/nginx/sites-available/checklist
#   sudo ln -s /etc/nginx/sites-available/checklist /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Para el certificado:  sudo certbot --nginx -d checklist.ejemplo.com

server {
    listen 80;
    server_name checklist.ejemplo.com;

    # Los soportes pesan: hay PDF de varios MB y se cargan varios a la vez
    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El OCR del RADIAN puede tardar; sin esto nginx corta con 504
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;
    }
}
