# Bloque para AGREGAR dentro del `server { ... }` que ya existe.
# No es un archivo de sitio completo: el servidor ya tiene uno con
# analitica-puc en la raíz y asistente-rb en /asistente/.
#
#   sudo nano /etc/nginx/sites-available/<tu-sitio>
#   ... pegar los dos location de abajo ...
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puertos ya usados en este servidor: 8000 (analitica-puc) y 8020
# (asistente-rb). Este proyecto usa 8030.

    # La aplicación necesita terminar en "/" para que sus rutas relativas
    # resuelvan bien. Sin este redirect, /checklist a secas rompe la interfaz.
    location = /checklist {
        return 301 /checklist/;
    }

    location /checklist/ {
        proxy_pass http://127.0.0.1:8030/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los soportes pesan: hay PDF de varios MB y se cargan varios a la vez
        client_max_body_size 64M;

        # El OCR del RADIAN tarda ~20 s por documento; sin esto nginx corta
        # con 504 antes de que termine
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # La aplicación tiene su propio login, así que aquí no hace falta
        # auth_basic. Las cuentas se crean en el servidor con:
        #   .venv/bin/python app/usuarios.py crear <usuario>
    }

# --------------------------------------------------------------------------- #
# Por qué la barra final importa
# --------------------------------------------------------------------------- #
# `proxy_pass http://127.0.0.1:8030/;` con barra final quita el prefijo
# /checklist/ antes de pasar la petición: la aplicación recibe "/" y
# "/api/cargar", que es lo que espera.
#
# La interfaz llama a la API con rutas relativas ("api/cargar"), así que el
# navegador las resuelve contra /checklist/ y quedan en /checklist/api/cargar.
# Si fueran absolutas ("/api/cargar") caerían en el /api/ de analitica-puc.
